server:
  port: 8080
  error:
    include-message: always

spring:
  application:
    name: banking-account-pure-hexagonal
  # API Versioning (Spring Boot 4)
  mvc:
    api-version:
      required: true
      supported: 1,2
      use:
        path-segment: 1

  datasource:
    url: jdbc:postgresql://localhost:5435/db_hexagonal
    username: magadiflo
    password: magadiflo

  jpa:
    hibernate:
      ddl-auto: validate    # validate: hibernate solo valida el schema, Flyway es quien lo crea
    properties:
      hibernate:
        format_sql: true

  flyway:
    baseline-on-migrate: true
    validate-on-migrate: true
    enabled: true
    locations: classpath:db/migration
    baseline-description: 'init'
    baseline-version: 0

logging:
  level:
    dev.magadiflo.banking.app: debug
    org.hibernate.SQL: debug
    org.flywaydb: info
